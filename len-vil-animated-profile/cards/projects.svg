<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
      <title id="title">Selected projects</title><desc id="desc">Five project highlights: VARTHA, CropGenius, CareConnect, TrustLens and CashVision.</desc><style>
      .reveal{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
      .shine{animation:shine 5s ease-in-out infinite}
      @keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes shine{0%,72%,100%{transform:translateX(-360px);opacity:0}78%{opacity:.55}90%{transform:translateX(780px);opacity:0}}
      @media(prefers-reduced-motion:reduce){.reveal,.pulse,.shine{animation:none!important;opacity:1!important;transform:none!important}}
    </style>
      <rect width="960" height="330" rx="16" fill="#f3efe5"/><rect x="16" y="16" width="928" height="298" rx="11" fill="#fffdf7" stroke="#d9d2c5"/>
      <text x="30" y="42" fill="#3768d7" font-size="10" letter-spacing="2">SELECTED WORK / IDEAS IN PROGRESS</text>
      <g class="reveal d1">
          <rect x="22" y="56" width="286" height="108" rx="10" fill="#fffdf7" stroke="#d9d2c5"/>
          <rect x="22" y="56" width="5" height="108" rx="2" fill="#3768d7"/>
          <text x="42" y="83" fill="#3768d7" font-size="9" letter-spacing="1.5">PROJECT / 01</text>
          <text x="42" y="112" fill="#20262d" font-size="19" font-weight="700">VARTHA</text>
          <text x="42" y="135" fill="#66717b" font-size="10">AI-powered multilingual news access</text>
        </g><g class="reveal d2">
          <rect x="329" y="56" width="286" height="108" rx="10" fill="#fffdf7" stroke="#d9d2c5"/>
          <rect x="329" y="56" width="5" height="108" rx="2" fill="#4b936e"/>
          <text x="349" y="83" fill="#4b936e" font-size="9" letter-spacing="1.5">PROJECT / 02</text>
          <text x="349" y="112" fill="#20262d" font-size="19" font-weight="700">CropGenius</text>
          <text x="349" y="135" fill="#66717b" font-size="10">Crop insights, disease detection and market tracking</text>
        </g><g class="reveal d3">
          <rect x="636" y="56" width="286" height="108" rx="10" fill="#fffdf7" stroke="#d9d2c5"/>
          <rect x="636" y="56" width="5" height="108" rx="2" fill="#db765e"/>
          <text x="656" y="83" fill="#db765e" font-size="9" letter-spacing="1.5">PROJECT / 03</text>
          <text x="656" y="112" fill="#20262d" font-size="19" font-weight="700">CareConnect</text>
          <text x="656" y="135" fill="#66717b" font-size="10">Healthcare appointments and reminders</text>
        </g><g class="reveal d1">
          <rect x="176" y="188" width="286" height="108" rx="10" fill="#fffdf7" stroke="#d9d2c5"/>
          <rect x="176" y="188" width="5" height="108" rx="2" fill="#58677d"/>
          <text x="196" y="215" fill="#58677d" font-size="9" letter-spacing="1.5">PROJECT / 04</text>
          <text x="196" y="244" fill="#20262d" font-size="19" font-weight="700">TrustLens</text>
          <text x="196" y="267" fill="#66717b" font-size="10">A browser companion for safer browsing</text>
        </g><g class="reveal d2">
          <rect x="483" y="188" width="286" height="108" rx="10" fill="#fffdf7" stroke="#d9d2c5"/>
          <rect x="483" y="188" width="5" height="108" rx="2" fill="#b58a36"/>
          <text x="503" y="215" fill="#b58a36" font-size="9" letter-spacing="1.5">PROJECT / 05</text>
          <text x="503" y="244" fill="#20262d" font-size="19" font-weight="700">CashVision</text>
          <text x="503" y="267" fill="#66717b" font-size="10">Currency recognition concept</text>
        </g>
    </svg>