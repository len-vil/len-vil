      <text x="40" y="77" fill="#20262d" font-size="16" font-weight="700">I enjoy turning ideas into useful, working projects.</text>
      <text x="40" y="101" fill="#66717b" font-size="12">Currently exploring full-stack development, Flutter, AI-powered applications and practical problem-solving.</text>
